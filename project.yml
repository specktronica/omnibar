name: Omnibar
options:
  bundleIdPrefix: io.specktronica
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages: {}

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.specktronica.omnibar
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSHighResolutionCapable: YES
    INFOPLIST_KEY_NSAccessibilityUsageDescription: "Omnibar needs Accessibility to list windows, switch between them, and control minimize, close, and fullscreen."
    INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Omnibar uses Screen Recording to show live window thumbnails on hover. This permission is optional."
    CODE_SIGN_ENTITLEMENTS: Omnibar/Resources/Omnibar.entitlements
    # A stable signing identity is required for TCC (Accessibility, Screen
    # Recording) grants to survive rebuilds. Ad-hoc ("-") signatures produce a
    # cdhash-based designated requirement that changes on every build, so the
    # grant in System Settings stops matching the running binary.
    # scripts/build.sh overrides these to ad-hoc when no identity is installed.
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: Y3QXTYSC64
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    COMBINE_HIDPI_IMAGES: YES
    LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Omnibar:
    type: application
    platform: macOS
    sources:
      - path: Omnibar
        excludes:
          - "**/*.md"
    resources:
      - path: Omnibar/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Omnibar
        INFOPLIST_KEY_CFBundleDisplayName: Omnibar
        INFOPLIST_KEY_CFBundleName: Omnibar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -default-isolation=MainActor"
    entitlements:
      path: Omnibar/Resources/Omnibar.entitlements
    scheme:
      testTargets:
        - OmnibarTests

  OmnibarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OmnibarTests
    dependencies:
      - target: Omnibar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.specktronica.omnibar.tests
        GENERATE_INFOPLIST_FILE: YES
        # Must share the host app's team; ad-hoc ("-") fails TEST_HOST load with
        # "mapping process and mapped file have different Team IDs".
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: Y3QXTYSC64
        CODE_SIGN_STYLE: Manual
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Omnibar.app/Contents/MacOS/Omnibar"
        BUNDLE_LOADER: "$(TEST_HOST)"
